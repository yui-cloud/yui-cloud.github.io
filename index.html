<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --sage:#A6CFB8; --lilac:#D0A8C9; --blue:#457BF1; --magenta:#DC308F;
    --plum:#480C33; --ink:#000; --paper:#FFF; --needle:#D8F542;
    --studio:#070408; --muted:#9c8794; --muted2:#b3a0ac; --line:#251c22;
    --card:#151015;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth; overflow-x:hidden}
  body{
    background:var(--studio); color:var(--paper);
    font-family:"Noto Sans JP","Helvetica Neue",Helvetica,-apple-system,Arial,sans-serif;
    line-height:1.7; overflow-x:hidden;
  }
  ::selection{background:var(--magenta); color:#fff}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px}
  .eyebrow{font-family:"IBM Plex Mono",monospace; letter-spacing:.28em; font-size:11px; color:var(--muted); text-transform:uppercase}
  a{color:inherit}

  /* ---------- nav ---------- */
  nav{position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:#070408cc; border-bottom:1px solid var(--line)}
  nav .wrap{display:flex; align-items:center; gap:18px; height:64px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:.01em}
  .brandmark{width:28px;height:28px;border-radius:7px;display:block;box-shadow:0 0 0 1px #ffffff26}
  .langsw{margin-left:auto; display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; font-size:12px; font-weight:500}
  .langsw button{background:none;border:none;color:var(--muted);padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px}
  .langsw button.on{background:#fff;color:#000;font-weight:700}
  .navcta{background:var(--sage); color:#10231a; font-weight:700; font-size:13px; padding:9px 18px; border-radius:99px; text-decoration:none; white-space:nowrap}

  /* ---------- hero ---------- */
  header{position:relative; overflow:hidden}
  .heroglow{position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none}
  .hg-a{width:520px;height:520px;background:var(--magenta);opacity:.2;top:-120px;right:-140px}
  .hg-b{width:420px;height:420px;background:var(--blue);opacity:.16;bottom:-160px;left:-140px}
  .hg-c{width:300px;height:300px;background:var(--sage);opacity:.12;top:40%;left:38%}
  .hero{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:40px; align-items:center; padding:72px 0 40px; position:relative}
  .hero h1{font-size:clamp(38px,5.6vw,60px); font-weight:900; line-height:1.18; letter-spacing:-.02em; text-wrap:balance; margin:16px 0 18px}
  .hero .sub{color:var(--muted2); font-size:15.5px; max-width:30em; margin-bottom:30px}
  .ctarow{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .storebadge{display:flex; align-items:center; gap:10px; background:#000; border:1px solid #ffffff3b; border-radius:12px; padding:9px 18px 9px 14px; text-decoration:none; transition:border-color .2s}
  .storebadge:hover{border-color:#fff}
  .storebadge .txt{line-height:1.25}
  .storebadge .s{display:block; font-size:9.5px; color:#cfc4cb}
  .storebadge .l{display:block; font-size:16.5px; font-weight:600; letter-spacing:.01em}
  .ctanote{font-size:11.5px; color:var(--muted)}
  .ctanote b{color:var(--sage); font-weight:700}

  /* shards */
  .shard{position:absolute;border-radius:30% 70% 55% 45%/55% 40% 60% 45%;filter:blur(1.5px);box-shadow:0 14px 30px #0009;z-index:6}
  .s-a{width:52px;height:40px;background:linear-gradient(135deg,var(--sage),var(--blue) 70%);top:60px;right:8%;transform:rotate(-18deg)}
  .s-b{width:26px;height:21px;background:linear-gradient(135deg,var(--lilac),var(--magenta));top:64%;right:44%;transform:rotate(24deg)}
  .s-c{width:20px;height:16px;background:linear-gradient(135deg,var(--needle),var(--sage));top:22%;right:40%;transform:rotate(40deg);filter:blur(2.5px)}

  /* ---------- phone ---------- */
  .phone{width:300px; border-radius:46px; background:#050505; padding:10px;
    border:1px solid #3a2c36; box-shadow:0 30px 80px #000c, 0 0 90px #dc308f26, inset 0 0 0 1px #1a1418; flex:0 0 auto}
  .screen{border-radius:37px; overflow:hidden; height:610px; position:relative; background:var(--ink); display:flex; flex-direction:column}
  /* 実機スクリーンショット(iPhone 16e の 390×844 と同じ縦横比) */
  .screen.real{height:606px; background:#0b0910}
  .screen.real img{width:100%; height:100%; object-fit:cover; object-position:top; display:block}
  .island{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:86px; height:24px; border-radius:14px; background:#000; z-index:9; border:1px solid #151015}
  .aura::before{content:""; position:absolute; inset:-30%;
    background:radial-gradient(closest-side at 62% 40%, var(--plum) 0%, transparent 72%); filter:blur(6px); pointer-events:none}
  .pill{display:flex; align-items:center; justify-content:center; gap:10px; font-weight:500;
    background:var(--sage); border-radius:99px; padding:13px; font-size:14px; color:#10231a}
  .apphero::before{content:""; position:absolute; inset:-40% -20%;
    background:radial-gradient(closest-side at 50% 46%, var(--magenta) 0%, transparent 68%); opacity:.28; filter:blur(18px)}
  .miniruler b.t{height:14px}.miniruler b.s{height:7px;opacity:.6}
  .miniruler .nd{position:absolute;width:2.5px;height:17px;background:var(--needle);border-radius:2px;bottom:0}
  .orb{position:absolute; left:50%; top:44%; width:340px; height:340px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, var(--plum) 0%, var(--magenta) 40%, transparent 72%);
    filter:blur(14px); border-radius:50%; animation:brz 8s ease-in-out infinite}
  @keyframes brz{0%,100%{transform:translate(-50%,-50%) scale(.72)}50%{transform:translate(-50%,-50%) scale(1.08)}}
  .dashes b.on{background:#fff}
  .btn{flex:1; text-align:center; padding:13px; border-radius:99px; font-size:14px; font-weight:600;
    background:#a6cfb84d; border:1px solid #a6cfb833}

  /* 7seg */
  .dm{display:inline-flex; gap:7px; align-items:flex-end; color:#fff}
  .dm .unit{font-size:13px; font-weight:500; margin:0 2px 1px; opacity:.9}
  .dm.magenta{color:var(--magenta)}
  .dm svg{filter:drop-shadow(0 0 14px rgba(255,255,255,.12))}
  .dm.magenta svg{filter:drop-shadow(0 0 18px rgba(220,48,143,.55))}
  .dm.giant .unit{font-size:26px; margin-bottom:6px}

  /* ---------- sections ---------- */
  section{padding:96px 0; border-top:1px solid var(--line); position:relative}
  .sechead{max-width:640px}
  .sechead h2{font-size:clamp(26px,3.6vw,40px); font-weight:900; letter-spacing:-.015em; line-height:1.3; margin:14px 0 14px; text-wrap:balance}
  .sechead p{color:var(--muted2); font-size:15px}

  /* shock */
  .shock{text-align:center}
  .shock .lead{font-size:clamp(19px,2.6vw,26px); font-weight:700; color:var(--muted2); margin:14px 0 34px}
  .shock .lead b{color:#fff}
  .shocknum{display:flex; justify-content:center; margin:10px 0 26px}
  .shock .after{font-size:clamp(19px,2.6vw,26px); font-weight:700; margin-bottom:14px}
  .shock .foot{font-size:11.5px; color:var(--muted)}

  /* features */
  .feat{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; align-items:center; padding:72px 0}
  .feat+.feat{border-top:1px dashed #251c2288}
  .feat .phone{justify-self:center}
  .hero .txt, .feat .txt{min-width:0}
  .feat h3{font-size:clamp(24px,3vw,34px); font-weight:900; letter-spacing:-.015em; line-height:1.35; margin:12px 0 14px; text-wrap:balance}
  .feat .body{color:var(--muted2); font-size:15px; max-width:26em}
  .feat ul{list-style:none; margin-top:18px; display:flex; flex-direction:column; gap:9px}
  .feat li{font-size:13.5px; color:#cfc4cb; display:flex; gap:10px; align-items:baseline}
  .feat li::before{content:""; width:8px; height:8px; border-radius:50%; flex:0 0 auto; transform:translateY(-1px)}
  .feat li.c-sage::before{background:var(--sage)} .feat li.c-magenta::before{background:var(--magenta)}
  .feat li.c-blue::before{background:var(--blue)} .feat li.c-lilac::before{background:var(--lilac)}
  .feat li.c-needle::before{background:var(--needle)}
  .feat.rev .txt{order:2} .feat.rev .phone{order:1}

  /* free */
  .free{text-align:center}
  .free .cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; max-width:840px; margin:40px auto 0}
  .free .cardi{background:var(--card); border:1px solid #ffffff12; border-radius:22px; padding:26px 20px; text-align:left}
  .free .cardi h4{font-size:15.5px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:9px}
  .free .cardi h4 i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .free .cardi p{font-size:12.5px; color:var(--muted2)}

  /* final cta */
  .final{text-align:center; overflow:hidden}
  .final h2{font-size:clamp(30px,4.6vw,52px); font-weight:900; letter-spacing:-.02em; margin:14px 0 12px}
  .final p{color:var(--muted2); font-size:15px; margin-bottom:30px}
  .final .ctarow{justify-content:center}
  .finalglow{position:absolute; width:640px; height:340px; left:50%; bottom:-200px; transform:translateX(-50%);
    background:radial-gradient(closest-side, var(--magenta), transparent 70%); opacity:.22; filter:blur(50px); pointer-events:none}

  footer{border-top:1px solid var(--line); padding:36px 0 60px; font-size:12px; color:var(--muted)}
  footer .wrap{display:flex; gap:22px; flex-wrap:wrap; align-items:center}
  footer a{color:var(--muted2); text-decoration:none}
  footer a:hover{color:#fff}
  footer .cr{margin-left:auto; text-align:right}

  /* reveal */
  .rv{opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s ease}
  .rv.in{opacity:1; transform:none}
  @media (prefers-reduced-motion: reduce){
    .rv{opacity:1; transform:none; transition:none}
  }

  @media (max-width:860px){
    .hero{grid-template-columns:minmax(0,1fr); padding-top:48px; text-align:center}
    .hero .sub{margin-left:auto; margin-right:auto}
    .ctarow{justify-content:center}
    .hero .phone{justify-self:center; margin-top:10px}
    .feat{grid-template-columns:minmax(0,1fr); gap:34px; text-align:center}
    .feat .body{margin:0 auto}
    .feat ul{align-items:center}
    .feat.rev .txt{order:1} .feat.rev .phone{order:2}
    .free .cards{grid-template-columns:minmax(0,1fr)}
    .sechead{margin:0 auto; text-align:center}
    .navcta{display:none}
  }
</style>

<script>
// ---- 言語切替 ----
let lang = "ja";
function applyLang(){
  document.querySelectorAll(".tr").forEach(el=>{ el.innerHTML = (lang==="en"?el.dataset.en:el.dataset.ja)||""; });
  document.getElementById("btnJa").classList.toggle("on", lang==="ja");
  document.getElementById("btnEn").classList.toggle("on", lang==="en");
  renderAllDM();
  document.querySelectorAll("img.realshot").forEach(el=>{ el.src = `lp/${lang==="en"?"en":"ja"}/${el.dataset.shot}.webp`; });
  document.documentElement.lang = lang;
}
document.getElementById("btnJa").onclick = ()=>{ lang="ja"; applyLang(); };
document.getElementById("btnEn").onclick = ()=>{ lang="en"; applyLang(); };

// ---- 7セグメント(アプリ実機と同じ描画) ----
const SEG={"0":"abcdef","1":"bc","2":"abdeg","3":"abcdg","4":"bcfg",
 "5":"acdfg","6":"acdefg","7":"abc","8":"abcdefg","9":"abcdfg","-":"g"};
function hpts(x,y,l,t){return `${x},${y+t/2} ${x+t/2},${y} ${x+l-t/2},${y} ${x+l},${y+t/2} ${x+l-t/2},${y+t} ${x+t/2},${y+t}`}
function vpts(x,y,l,t){return `${x+t/2},${y} ${x+t},${y+t/2} ${x+t},${y+l-t/2} ${x+t/2},${y+l} ${x},${y+l-t/2} ${x},${y+t/2}`}
function segDigit(ch,h){
  const W=100,H=175,t=24,pad=t*0.55,arm=(H-t)/2-pad,on=SEG[ch]||"";
  if(ch==="."){const d=t*0.9,sc=h/H;
    return `<svg viewBox="0 0 ${d*1.4} ${H}" width="${d*1.4*sc}" height="${h}" style="display:block"><rect x="0" y="${H-d}" width="${d}" height="${d}" rx="${d*0.3}" fill="currentColor"/></svg>`;}
  const P={a:hpts(pad,0,W-pad*2,t),g:hpts(pad,(H-t)/2,W-pad*2,t),d:hpts(pad,H-t,W-pad*2,t),
    f:vpts(0,pad,arm,t),b:vpts(W-t,pad,arm,t),e:vpts(0,(H+t)/2,arm,t),c:vpts(W-t,(H+t)/2,arm,t)};
  const sc=h/H;let out=`<svg viewBox="0 0 ${W} ${H}" width="${W*sc}" height="${h}" style="display:block">`;
  for(const k in P){ if(on.includes(k)) out+=`<polygon points="${P[k]}" fill="currentColor"/>`; }
  return out+"</svg>";
}
function renderDM(el, text, units){
  const h = el.classList.contains("giant")?96:(el.classList.contains("huge")?64:(el.classList.contains("big")?54:40));
  el.innerHTML="";
  const parts=String(text).split(":");
  parts.forEach((p,i)=>{
    for(const ch of p){const w=document.createElement("span");w.style.display="block";w.innerHTML=segDigit(ch,h);el.appendChild(w.firstChild);}
    if(units&&units[i]){const u=document.createElement("span");u.className="unit";u.textContent=units[i];el.appendChild(u);}
  });
}
function renderAllDM(){
  document.querySelectorAll(".dm[data-text]").forEach(el=>{
    renderDM(el, el.dataset.text, ((lang==="en"?el.dataset.unitsEn:el.dataset.unitsJa)||"").split("|").filter(Boolean));
  });
  const sn=document.getElementById("shockNum");
  if(sn && !sn.dataset.animating) renderDM(sn, sn.dataset.now || "16.2", [lang==="en"?"yrs":"年"]);
}

// ---- スクロールで出現 + 16.2年カウントアップ ----
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting) return;
    e.target.classList.add("in");
    const sn = e.target.querySelector("#shockNum");
    if(sn && !sn.dataset.done){
      sn.dataset.done = "1";
      if(reduce){ sn.dataset.now="16.2"; renderAllDM(); return; }
      sn.dataset.animating = "1";
      const t0 = performance.now(), dur = 1600;
      (function tick(now){
        const p = Math.min(1,(now-t0)/dur), ease = 1-Math.pow(1-p,3);
        const v = (16.2*ease).toFixed(1);
        sn.dataset.now = v;
        renderDM(sn, v, [lang==="en"?"yrs":"年"]);
        if(p<1) requestAnimationFrame(tick); else delete sn.dataset.animating;
      })(t0);
    }
    io.unobserve(e.target);
  });
},{threshold:.25});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));

applyLang();
</script>
